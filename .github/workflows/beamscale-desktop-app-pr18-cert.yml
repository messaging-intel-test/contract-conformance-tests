name: certify BeamScale desktop app PR18

on:
  pull_request:
    paths:
      - "certifications/beamscale-desktop-app-pr18/**"
      - ".github/workflows/beamscale-desktop-app-pr18-cert.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact carrier revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify exact changed source blobs
        shell: bash
        run: |
          set -euo pipefail
          root="certifications/beamscale-desktop-app-pr18"
          test "$(git hash-object "$root/Cargo.toml")" = "1c15e4bfb9f76be1f500589af72455d0030eddbb"
          test "$(git hash-object "$root/src/main.rs")" = "9ba15003751dade583bdb24c57fcb9b14919f9bc"

      - name: Install declared MSRV
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: Format exact changed source
        working-directory: certifications/beamscale-desktop-app-pr18
        run: rustfmt +1.90.0 --check src/main.rs

      - name: Clippy integration
        working-directory: certifications/beamscale-desktop-app-pr18
        run: cargo +1.90.0 clippy --all-targets -- -D warnings

      - name: Test integration
        working-directory: certifications/beamscale-desktop-app-pr18
        run: cargo +1.90.0 test --all-targets
