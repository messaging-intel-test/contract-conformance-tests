name: Bootstrap msgint CLI PR2 certification lock

on:
  push:
    branches:
      - certify/msgint-cli-pr2-flags
    paths:
      - certifications/msgint-cli-pr2/Cargo.toml
      - .github/workflows/msgint-cli-pr2-lock-bootstrap.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: certifications/msgint-cli-pr2
    steps:
      - name: Check out certification branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.90.0'

      - name: Generate and verify exact lock
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Commit lock if changed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- Cargo.lock)" ]]; then
            echo 'Cargo.lock already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'test(DEN-427): lock msgint CLI certification graph'
          git push origin "HEAD:${GITHUB_REF_NAME}"
