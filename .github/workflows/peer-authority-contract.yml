name: Messaging Intel peer authority contract

on:
  pull_request:
    paths:
      - "contracts/message-signal/**"
      - ".github/workflows/peer-authority-contract.yml"
  push:
    branches: [main]
    paths:
      - "contracts/message-signal/**"
      - ".github/workflows/peer-authority-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-authority:
    uses: flags-2-env-test/contract-conformance-tests/.github/workflows/peer-authority-convergence.yml@ffaaa6bb025de65ea4440d78c61722adc94ac090
    with:
      typespec_path: contracts/message-signal/main.tsp
      schema_path: contracts/message-signal/authored.schema.json
      instances_path: contracts/message-signal/instances
      expected_declarations_json: '["MessagingIntelSignal.MessageSignalV1"]'
