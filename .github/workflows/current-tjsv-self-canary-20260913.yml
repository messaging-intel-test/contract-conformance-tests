name: Current TJSV self-contained peer-authority canary

on:
  pull_request:
    paths: ['.github/workflows/current-tjsv-self-canary-20260913.yml']
  push:
    branches: [main]
    paths: ['.github/workflows/current-tjsv-self-canary-20260913.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  peer-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Materialize independent peer authorities and corpus
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/.typespec-json-schema-validator/canary/source"
          mkdir -p "$root/instances/AuthFactorPolicyV1/valid" "$root/instances/AuthFactorPolicyV1/invalid"
          cat > "$root/main.tsp" <<'TSP'
          import "@typespec/json-schema";
          using TypeSpec.JsonSchema;
          namespace ThreeFaAuthFactorPolicy;
          @id("AuthFactorPolicyV1")
          model AuthFactorPolicyV1 {
            @minValue(1) @maxValue(1) version: integer;
            @minLength(1) @maxLength(80) label: string;
            @minValue(1) @maxValue(3) factor_count: integer;
            enabled?: boolean;
          }
          TSP
          cat > "$root/authored.schema.json" <<'JSON'
          {"$schema":"https://json-schema.org/draft/2020-12/schema","$defs":{"AuthFactorPolicyV1":{"$schema":"https://json-schema.org/draft/2020-12/schema","$id":"AuthFactorPolicyV1","type":"object","properties":{"version":{"type":"integer","minimum":1,"maximum":1},"label":{"type":"string","minLength":1,"maxLength":80},"factor_count":{"type":"integer","minimum":1,"maximum":3},"enabled":{"type":"boolean"}},"required":["version","label","factor_count"],"unevaluatedProperties":false}}}
          JSON
          printf '%s\n' '{"version":1,"label":"test","factor_count":2,"enabled":true}' > "$root/instances/AuthFactorPolicyV1/valid/two-factor.json"
          printf '%s\n' '{"version":1,"label":"test","factor_count":4}' > "$root/instances/AuthFactorPolicyV1/invalid/four-factors.json"
      - name: Compile TypeSpec to Schema B and compare authored Schema A
        uses: ORESoftware/typespec-json-schema-validator@a952c53b4628b1d12e21ed51879d910a8c19a581
        with:
          typespec: .typespec-json-schema-validator/canary/source/main.tsp
          schema: .typespec-json-schema-validator/canary/source/authored.schema.json
          instances: .typespec-json-schema-validator/canary/source/instances
          report: .typespec-json-schema-validator/canary/report.json
          contract_ir: .typespec-json-schema-validator/canary/contract-ir.json
          output_dir: .typespec-json-schema-validator/canary/generated
      - name: Verify current evidence and exact declaration scope
        uses: ORESoftware/typespec-json-schema-validator/actions/verify-contract-ir@a952c53b4628b1d12e21ed51879d910a8c19a581
        with:
          contract_ir: .typespec-json-schema-validator/canary/contract-ir.json
          report: .typespec-json-schema-validator/canary/report.json
          typespec: .typespec-json-schema-validator/canary/source/main.tsp
          schema: .typespec-json-schema-validator/canary/source/authored.schema.json
          generated_schema: .typespec-json-schema-validator/canary/generated/typespec.generated.schema.json
          expected_declarations: '["ThreeFaAuthFactorPolicy.AuthFactorPolicyV1"]'
      - name: Require first-class peer authority admission
        run: |
          set -euo pipefail
          jq -e '.status == "passed" and .zeroUnexplainedFindings == true and .authorities.typespec.authority == "independently-authored" and .authorities.jsonSchema.authority == "independently-authored" and .authorities.precedence == "none"' .typespec-json-schema-validator/canary/report.json >/dev/null
          git diff --exit-code
