name: Materialize DEN-3425 artifact compatibility repair

on:
  push:
    branches:
      - alexanderdmills/den-3425-run-evidence
    paths:
      - '.github/workflows/den-3425-artifact-compat-materializer.yml'

permissions:
  contents: write

concurrency:
  group: den-3425-artifact-compat-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'messaging-intel-test/contract-conformance-tests' &&
      github.ref == 'refs/heads/alexanderdmills/den-3425-run-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact carrier commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact source blobs and repair compatibility drift
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REPOSITORY" = messaging-intel-test/contract-conformance-tests
          test "$GITHUB_REF_NAME" = alexanderdmills/den-3425-run-evidence
          test "$(git hash-object src/deep_tests/run_evidence_artifact.py)" = c8b9db2360135d529c28e24886ccf9a5f3de1937
          test "$(git hash-object tests/test_run_evidence_artifact.py)" = c5a9cf000305f6c41c54e1a177d2ca2c432ada10
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement, found {count}")
              target.write_text(text.replace(old, new))

          artifact = "src/deep_tests/run_evidence_artifact.py"
          replace_once(artifact, "import hashlib\nimport re", "import hashlib\nimport json\nimport re")
          replace_once(
              artifact,
              "from .run_evidence import (\n    Counts,\n    EvidenceValidationError,",
              "from .run_evidence import (\n    Counts,\n    EVIDENCE_SCHEMA,\n    EvidenceValidationError,",
          )
          replace_once(
              artifact,
              "    RunEvidence,\n    RunStatus,\n    canonical_json,\n    scan_for_sensitive_material,",
              "    RunEvidence,\n    RunStatus,\n    scan_for_sensitive_material,",
          )
          replace_once(
              artifact,
              "def _artifact_digest(body: Mapping[str, object]) -> str:\n"
              "    return f\"sha256:{hashlib.sha256(canonical_json(body).encode('utf-8')).hexdigest()}\"",
              "def _artifact_digest(body: Mapping[str, object]) -> str:\n"
              "    encoded = json.dumps(body, sort_keys=True, separators=(\",\", \":\")).encode(\"utf-8\")\n"
              "    return f\"sha256:{hashlib.sha256(encoded).hexdigest()}\"",
          )
          replace_once(artifact, "payload = provider.to_dict()", "payload = provider.payload()")
          replace_once(
              artifact,
              '        "counts",\n        "ended_at",\n        "execution_mode",',
              '        "counts",\n        "ended_at",\n        "schema",\n        "execution_mode",',
          )
          replace_once(
              artifact,
              '    if set(payload) != expected:\n'
              '        raise EvidenceValidationError("run evidence fields do not match the artifact contract")\n'
              '    raw_counts = payload["counts"]',
              '    if set(payload) != expected:\n'
              '        raise EvidenceValidationError("run evidence fields do not match the artifact contract")\n'
              '    if payload["schema"] != EVIDENCE_SCHEMA:\n'
              '        raise EvidenceValidationError("run evidence schema does not match the artifact contract")\n'
              '    raw_counts = payload["counts"]',
          )
          replace_once(
              artifact,
              '        "accepted",\n        "queued",',
              '        "accepted",\n        "rejected",',
          )
          replace_once(
              artifact,
              "        self.evidence.validate(observed_at=observed_at)\n"
              "        scan_for_sensitive_material(self.body())\n\n"
              "    def body(self) -> dict[str, object]:\n"
              "        self.validate()\n"
              "        return {\n"
              "            \"run_evidence\": _run_payload(self.evidence),\n"
              "            \"schema_version\": self.schema_version,\n"
              "            \"suite_sha\": self.suite_sha,\n"
              "        }\n",
              "        observed = self.evidence.ended_at if observed_at is None else observed_at\n"
              "        self.evidence.validate(observed_at=observed)\n"
              "        scan_for_sensitive_material(self._body_unchecked())\n\n"
              "    def _body_unchecked(self) -> dict[str, object]:\n"
              "        return {\n"
              "            \"run_evidence\": _run_payload(self.evidence),\n"
              "            \"schema_version\": self.schema_version,\n"
              "            \"suite_sha\": self.suite_sha,\n"
              "        }\n\n"
              "    def body(self) -> dict[str, object]:\n"
              "        self.validate()\n"
              "        return self._body_unchecked()\n",
          )

          tests = "tests/test_run_evidence_artifact.py"
          replace_once(tests, "            accepted=5,\n            queued=5,", "            accepted=5,\n            rejected=1,")
          replace_once(
              tests,
              "queue_write_status=QueueWriteStatus.SUCCEEDED",
              "queue_write_status=QueueWriteStatus.SYNTHETIC",
          )
          PY
          git diff --check

      - name: Compile and verify repository contract
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          python scripts/verify_repository.py

      - name: Run complete deterministic deep suite
        shell: bash
        env:
          PYTHONPATH: src
          DEEP_TEST_SEEDS: 0-49
        run: python -m unittest discover -s tests -v

      - name: Publish validated target bytes as non-workflow staging files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .repair-staging/src/deep_tests .repair-staging/tests
          cp src/deep_tests/run_evidence_artifact.py .repair-staging/src/deep_tests/run_evidence_artifact.py
          cp tests/test_run_evidence_artifact.py .repair-staging/tests/test_run_evidence_artifact.py
          git checkout -- \
            src/deep_tests/run_evidence_artifact.py \
            tests/test_run_evidence_artifact.py
          git status --porcelain=v1 --untracked-files=all | cut -c4- | LC_ALL=C sort > "$RUNNER_TEMP/actual-changed"
          cat > "$RUNNER_TEMP/expected-changed" <<'EOF'
          .repair-staging/src/deep_tests/run_evidence_artifact.py
          .repair-staging/tests/test_run_evidence_artifact.py
          EOF
          diff -u "$RUNNER_TEMP/expected-changed" "$RUNNER_TEMP/actual-changed"
          git add .repair-staging
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(DEN-3425): stage validated artifact compatibility bytes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
