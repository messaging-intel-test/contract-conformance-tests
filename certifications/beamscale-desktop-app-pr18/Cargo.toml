[package]
name = "bmscl-desktop-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Native BeamScale desktop runtime dashboard"
repository = "https://github.com/beamscale/bmscl-desktop-app.rs"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
needless_return = "allow"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
slint = { version = "1", default-features = false, features = ["backend-winit", "renderer-software", "compat-1-2"] }
